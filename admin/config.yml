backend:
  name: git-gateway
  branch: main

media_folder: "."
public_folder: "."

collections:
  - name: "content"
    label: "Contenido del Sitio"
    files:

      - name: "hero"
        label: "🏠 Hero — Presentación principal"
        file: "_data/content.yml"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Texto pequeño (eyebrow)", name: "eyebrow", widget: "string" }
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Título profesional", name: "title", widget: "string" }
              - { label: "Frase principal", name: "tagline", widget: "text", hint: "Puedes usar <strong>texto</strong> para negritas." }
              - { label: "Estadística 1 — Número", name: "stat1_number", widget: "string" }
              - { label: "Estadística 1 — Etiqueta", name: "stat1_label", widget: "string" }
              - { label: "Estadística 2 — Número", name: "stat2_number", widget: "string" }
              - { label: "Estadística 2 — Etiqueta", name: "stat2_label", widget: "string" }
          - label: "Sobre mí"
            name: "about"
            widget: "object"
            fields:
              - { label: "Cita destacada", name: "quote", widget: "text" }
              - { label: "Párrafo 1", name: "p1", widget: "text", hint: "Puedes usar <strong>texto</strong> para negritas." }
              - { label: "Párrafo 2", name: "p2", widget: "text" }
              - { label: "Párrafo 3", name: "p3", widget: "text" }
              - { label: "Pilar 1 — Título", name: "pillar1_title", widget: "string" }
              - { label: "Pilar 1 — Descripción", name: "pillar1_desc", widget: "string" }
              - { label: "Pilar 2 — Título", name: "pillar2_title", widget: "string" }
              - { label: "Pilar 2 — Descripción", name: "pillar2_desc", widget: "string" }
              - { label: "Pilar 3 — Título", name: "pillar3_title", widget: "string" }
              - { label: "Pilar 3 — Descripción", name: "pillar3_desc", widget: "string" }
          - label: "Experiencia 1 (más reciente)"
            name: "exp1"
            widget: "object"
            fields:
              - { label: "Empresa y fechas", name: "company", widget: "string" }
              - { label: "Puesto", name: "role", widget: "string" }
              - { label: "Descripción", name: "desc", widget: "text" }
              - { label: "Ubicación", name: "tag", widget: "string" }
